[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bari-simulation"
version = "0.1.0"
description = "MuJoCo simulation for BARI collision-avoidance, gap, and step tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.13,<4",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.16"]

[project.scripts]
barisimulation = "bari_sim.cli:main"

[tool.setuptools.packages.find]
include = ["bari_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
